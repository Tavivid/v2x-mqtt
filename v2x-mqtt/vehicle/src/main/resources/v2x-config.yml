# 共通設定
mqtt:
  host: localhost
  port: 1883
  clientPrefix: v2x-


udp:
# 車両間の点群送信に使用（大きめのペイロード用）
  send_port: 51234
  recv_port: 51235


region:
  geohash_precision: 9 # 8〜10 が推奨
  ttl_seconds: 5 # 地域内のアベイラビリティ情報の寿命


vehicle:
  id: vehicle-A
  publish_rate_hz: 2 # 1秒あたりの発行回数
  max_points_per_chunk: 400
  request_regions:
    - "xn76ur2p" # 任意の初期購読領域（デモ用）

  dataset:
    path: "./dataset/k15-44-59"   # ★ ここが dsPath に入る
    loop: true                   # ★ dsLoop に入る
    glob: "*.pcd"             # ★ dsGlob に入る

  transfer:
    send_dir: ./send
    send_file_template: "*{region}*.txt"
    recv_dir: ./recv

coordinator:
  announce_topic: v2x/announce