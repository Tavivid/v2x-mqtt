plugins {
    id 'application'
}

application {
    //mainClass = 'app.VehicleAgent'
    mainClass = 'v2x.vehicle.VehicleMain'
}

tasks.register('runRos', JavaExec) {
    group = 'application'
    description = 'Run rosjava-based vehicle node'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'v2x.vehicle.ros.VehicleRosMain'
}

configurations {
    all*.exclude group: 'org.apache.commons', module: 'com.springsource.org.apache.commons.httpclient'
    all*.exclude group: 'org.apache.commons', module: 'com.springsource.org.apache.commons.codec'
    all*.exclude group: 'org.apache.commons', module: 'com.springsource.org.apache.commons.io'
    all*.exclude group: 'org.apache.commons', module: 'com.springsource.org.apache.commons.lang'
    all*.exclude group: 'org.apache.commons', module: 'com.springsource.org.apache.commons.logging'
    all*.exclude group: 'org.apache.commons', module: 'com.springsource.org.apache.commons.net'
}

dependencies {
    implementation project(':common')
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.17.1'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.17.1'
    implementation 'org.yaml:snakeyaml:2.2'
    implementation "org.ros.rosjava_core:rosjava:0.3.6"
    implementation 'org.ros.rosjava_messages:std_msgs:0.5.11'
    implementation "org.ros.rosjava_bootstrap:message_generation:0.3.3"
    implementation 'io.netty:netty:3.5.13.Final'
    implementation "commons-logging:commons-logging:1.2"
    implementation 'commons-codec:commons-codec:1.15'
    implementation 'commons-httpclient:commons-httpclient:3.1'
    implementation "commons-net:commons-net:2.0"
    implementation files('libs/com.springsource.org.apache.commons.codec-1.3.0.jar')
    implementation files('libs/com.springsource.org.apache.commons.io-1.4.0.jar')
    implementation files('libs/com.springsource.org.apache.commons.lang-2.4.0.jar')
    implementation files('libs/com.springsource.org.apache.commons.httpclient-3.1.0.jar')
    implementation files('libs/com.springsource.org.apache.commons.logging-1.1.1.jar')
}

repositories {
    mavenCentral()

    maven {
        url "https://github.com/rosjava/rosjava_mvn_repo/raw/master"
    }
}